<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1100" viewBox="0 0 1440 1100" role="img" aria-labelledby="title desc">
  <title id="title">Lean UX Canvas de Hostera</title>
  <desc id="desc">Canvas Lean UX para la coordinación de la operación hotelera.</desc>
  <rect width="1440" height="1100" fill="#F3F6F4"/>

  <g font-family="Arial, Helvetica, sans-serif" fill="#0D1613">
    <text x="44" y="62" font-family="monospace" font-size="12" font-weight="700" letter-spacing="1.4" fill="#14523E">HOSTERA / SOLUTION PROFILE</text>
    <rect x="276" y="56" width="72" height="2" rx="1" fill="#9EF2CC"/>
    <text x="44" y="112" font-size="42" font-weight="700">Lean UX Canvas</text>
    <text x="44" y="142" font-size="16" fill="#5B6862">Coordinación de la operación hotelera · 1.2.2.4</text>

    <g transform="translate(1190,44)">
      <rect width="206" height="36" rx="8" fill="#FFFFFF" stroke="#C6CFCA"/>
      <text x="12" y="23" font-family="monospace" font-size="11" font-weight="700" letter-spacing="1" fill="#5B6862">DATE</text>
      <text x="130" y="23" font-family="monospace" font-size="13" font-weight="700">08.10.26</text>
      <rect y="44" width="206" height="36" rx="8" fill="#FFFFFF" stroke="#C6CFCA"/>
      <text x="12" y="67" font-family="monospace" font-size="11" font-weight="700" letter-spacing="1" fill="#5B6862">ITERATION</text>
      <text x="174" y="67" font-family="monospace" font-size="13" font-weight="700" fill="#14523E">02</text>
    </g>

    <rect x="40" y="196" width="1360" height="820" rx="12" fill="#FFFFFF" stroke="#0D1613" stroke-width="2"/>
    <rect x="42" y="198" width="408" height="258" fill="#FFFFFF"/>
    <rect x="42" y="458" width="408" height="298" fill="#FFFFFF"/>
    <rect x="42" y="758" width="408" height="256" fill="#FFFFFF"/>
    <rect x="452" y="198" width="298" height="558" fill="#E6F0E9"/>
    <rect x="452" y="758" width="298" height="256" fill="#FFFFFF"/>
    <rect x="752" y="198" width="646" height="258" fill="#FFFFFF"/>
    <rect x="752" y="458" width="646" height="298" fill="#F9FBFA"/>
    <rect x="752" y="758" width="646" height="256" fill="#FFFFFF"/>

    <path d="M450 198V1014 M750 198V1014 M42 456H450 M42 756H450 M452 756H750 M752 456H1398 M752 756H1398" fill="none" stroke="#0D1613" stroke-width="1.5"/>

    <g fill="#9BA59F" opacity="0.35" font-size="100" font-weight="700">
      <text x="360" y="430">1</text><text x="1300" y="430">2</text><text x="360" y="710">3</text><text x="1300" y="710">4</text>
      <text x="680" y="650">5</text><text x="360" y="980">6</text><text x="690" y="980">7</text><text x="1320" y="980">8</text>
    </g>

    <g font-family="monospace" font-size="11" font-weight="700" letter-spacing="1" fill="#14523E">
      <text x="62" y="224">01 / PROBLEM</text><circle cx="188" cy="220" r="3" fill="#E5B94C"/>
      <text x="62" y="484">03 / PEOPLE</text><circle cx="190" cy="480" r="3" fill="#3F7D5A"/>
      <text x="62" y="784" fill="#0D1613">06 / TEST</text><circle cx="164" cy="780" r="3" fill="#E5B94C"/>
      <text x="472" y="224">05 / MAKE</text><circle cx="570" cy="220" r="3" fill="#3F7D5A"/>
      <text x="472" y="784">07 / LEARN FIRST</text><circle cx="650" cy="780" r="3" fill="#E5B94C"/>
      <text x="772" y="224">02 / OUTCOME</text><circle cx="898" cy="220" r="3" fill="#3F7D5A"/>
      <text x="772" y="484">04 / BENEFIT</text><circle cx="882" cy="480" r="3" fill="#E5B94C"/>
      <text x="772" y="784">08 / TEST LEAN</text><circle cx="916" cy="780" r="3" fill="#3F7D5A"/>
    </g>

    <g font-size="23" font-weight="700">
      <text x="62" y="254">Business Problem</text>
      <text x="62" y="514">Users</text>
      <text x="62" y="814">Hypotheses</text>
      <text x="472" y="254">Solutions</text>
      <text x="472" y="814" font-size="21">What’s the most important</text>
      <text x="472" y="839" font-size="21">thing we need to learn first?</text>
      <text x="772" y="254">Business Outcomes</text>
      <text x="772" y="514">User Outcomes &amp; Benefits</text>
      <text x="772" y="814">What’s the least amount of work we need</text>
      <text x="772" y="839">to do to learn next?</text>
    </g>

    <g font-size="14" fill="#33423B">
      <text x="62" y="288"><tspan x="62" dy="0">Los hoteles de una a cinco sedes registran la</tspan><tspan x="62" dy="20">reserva en un canal y la operación en otro,</tspan><tspan x="62" dy="20">y concilian esa información a mano.</tspan></text>
      <text x="62" y="372" fill="#14523E" font-weight="700"><tspan x="62" dy="0">Consolidar a mano toma unos 40 min al</tspan><tspan x="62" dy="20">día en una cadena de tres sedes, y varios</tspan><tspan x="62" dy="20">minutos por consulta en una sede.</tspan></text>

      <text x="62" y="548"><tspan font-weight="700" fill="#14523E">Primary</tspan><tspan x="128">· Steven Huarcaya, administrador de un</tspan><tspan x="128" dy="18">hotel independiente de una sede.</tspan></text><text x="62" y="596"><tspan font-weight="700" fill="#14523E">Primary</tspan><tspan x="128">· Anyeli Cárdenas, responsable de</tspan><tspan x="128" dy="18">operaciones de una cadena de 2 a 5 sedes.</tspan></text>
      <text x="62" y="644"><tspan font-weight="700" fill="#14523E">Operativos</tspan><tspan x="150">· Recepción y almacén.</tspan></text>
      <text x="62" y="672"><tspan font-weight="700" fill="#14523E">Autorizados</tspan><tspan x="158">· Gestión y supervisión de accesos.</tspan></text>
      <text x="62" y="700"><tspan font-weight="700" fill="#14523E">Indirectos</tspan><tspan x="146">· Huéspedes beneficiados.</tspan></text>

      <text x="62" y="850" font-size="9" fill="#0D1613"><tspan x="62" dy="0">1. Creemos que lograremos 50 suscripciones Starter en 4 meses si Steven obtiene</tspan><tspan x="62" dy="15">el estado de su propiedad sin su hoja de cálculo, con el panel de la propiedad.</tspan><tspan x="62" dy="15">2. Creemos que lograremos 90 % de retención con uso 5 días a la semana si</tspan><tspan x="62" dy="15">recepción ve la disponibilidad al atender, con reservas en un mismo calendario.</tspan><tspan x="62" dy="15">3. Creemos que lograremos 10 % de upgrades en 6 meses si Steven recibe la alerta</tspan><tspan x="62" dy="15">de un insumo bajo su umbral, con el control de existencias por ubicación.</tspan><tspan x="62" dy="15">4. Creemos que lograremos 20 cadenas en el plan Professional en 6 meses</tspan><tspan x="62" dy="15">si Anyeli obtiene el consolidado de sus sedes, con los reportes por propiedad.</tspan><tspan x="62" dy="15">5. Creemos que lograremos 90 % de retención con uso diario del RFID si Steven</tspan><tspan x="62" dy="15">identifica quién entró a una habitación, con la trazabilidad RFID.</tspan></text>

      <text x="472" y="288"><tspan x="472" dy="0">Plataforma web administrativa</tspan><tspan x="472" dy="20">centrada en la propiedad activa,</tspan><tspan x="472" dy="20">para una a cinco sedes.</tspan></text>
      <g fill="#0D1613">
        <circle cx="480" cy="372" r="9" fill="#14523E"/><text x="476" y="376" font-family="monospace" font-size="10" fill="#FFFFFF">A</text><text x="498" y="376">Panel de la propiedad activa.</text><text x="498" y="394">Ocupación, inventario y accesos.</text>
        <circle cx="480" cy="430" r="9" fill="#14523E"/><text x="476" y="434" font-family="monospace" font-size="10" fill="#FFFFFF">B</text><text x="498" y="434">Reservas y disponibilidad</text><text x="498" y="452">sobre un mismo calendario.</text>
        <circle cx="480" cy="488" r="9" fill="#14523E"/><text x="476" y="492" font-family="monospace" font-size="10" fill="#FFFFFF">C</text><text x="498" y="492">Existencias por ubicación,</text><text x="498" y="510">con alertas de reposición.</text>
        <circle cx="480" cy="546" r="9" fill="#14523E"/><text x="476" y="550" font-family="monospace" font-size="10" fill="#FFFFFF">D</text><text x="498" y="550">Credencial RFID ligada a</text><text x="498" y="568">habitación, persona e historial.</text>
        <circle cx="480" cy="604" r="9" fill="#14523E"/><text x="476" y="608" font-family="monospace" font-size="10" fill="#FFFFFF">E</text><text x="498" y="608">Reportes por propiedad y</text><text x="498" y="626">cambio de propiedad activa.</text>
      </g>

      <text x="472" y="880" font-size="11"><tspan x="472" dy="0">• Si el administrador de una sede</tspan><tspan x="472" dy="15">  sostiene su operación diaria en Hostera.</tspan><tspan x="472" dy="15">• Si eso basta para contratar y renovar</tspan><tspan x="472" dy="15">  el plan Starter (hipótesis 1).</tspan><tspan x="472" dy="15">• Si el consolidado ya construido decide</tspan><tspan x="472" dy="15">  el paso al plan Professional (hip. 4).</tspan></text>

      <text x="772" y="288"><tspan x="772" dy="0">• 50 suscripciones de pago activas en el plan Starter (S/39) en 4 meses.</tspan><tspan x="772" dy="24">• 20 cadenas pequeñas en el plan Professional (S/8 por habitación) en 6 meses.</tspan><tspan x="772" dy="24">• 10 % de clientes Starter que actualicen al plan Professional en 6 meses.</tspan><tspan x="772" dy="24">• Retención mensual del 90 % de los clientes.</tspan><tspan x="772" dy="24">• Uso de la plataforma al menos 5 días a la semana.</tspan></text>

      <text x="772" y="548"><tspan x="772" dy="0">• Conocer el estado de la propiedad sin reconstruirlo en una hoja de cálculo.</tspan><tspan x="772" dy="24">• Encontrar la disponibilidad y la reserva en el momento del check-in.</tspan><tspan x="772" dy="24">• Anticipar la falta de un insumo antes del descuadre del almacén.</tspan><tspan x="772" dy="24">• Saber qué persona accedió a una habitación y en qué momento.</tspan><tspan x="772" dy="24">• Obtener el consolidado de todas las sedes ya construido.</tspan></text>

      <text x="772" y="880"><tspan x="772" dy="0">• Publicar la Frontend Web Application con datos de demostración.</tspan><tspan x="772" dy="20">• Medir con tres administradores de una sede cuánto tardan en obtener</tspan><tspan x="772" dy="20">  el estado de su propiedad frente a su hoja de cálculo actual.</tspan></text>
      <text x="772" y="952" fill="#33423B"><tspan x="772" dy="0">• Sin Web Services ni integración RFID: alcance del Sprint 2.</tspan></text>
    </g>

  </g>
</svg>
